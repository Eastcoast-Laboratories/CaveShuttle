<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div class="editor-container">
    <!-- Main content -->
    <div class="editor-main">
      <!-- Left sidebar: Tools -->
      <aside class="sidebar left-sidebar">
        <br>
        <div class="tool-buttons">
          <button class="tool-btn active" data-tool="paint" data-i18n-title="paintTool">🖌️</button>
          <button class="tool-btn" data-tool="select" data-i18n-title="selectTool">🔲</button>
          <button class="tool-btn" data-tool="slope" data-i18n-title="slopeTool">📐</button>
          <button class="tool-btn" data-tool="triangle" data-i18n-title="triangleTool">🔺</button>
          <button class="tool-btn" data-tool="hill" data-i18n-title="hillTool">⛰️</button>
          <button class="tool-btn" data-tool="bucket" data-i18n-title="bucketTool">🪣</button>
          <button class="tool-btn" data-tool="eraser" data-i18n-title="eraserTool">🧹</button>
        </div>
        
        <h3 data-i18n="actions">Actions</h3>
        <div class="action-buttons">
          <button id="undoBtn" class="action-btn" data-i18n-title="undo">↶</button>
          <button id="redoBtn" class="action-btn" data-i18n-title="redo">↷</button>
          <button id="copyBtn" class="action-btn" data-i18n-title="copy">📋</button>
          <button id="pasteBtn" class="action-btn" data-i18n-title="paste">📄</button>
          <button id="fillBtn" class="action-btn" data-i18n-title="fillSelection">🪣</button>
          <button id="deleteBtn" class="action-btn" data-i18n-title="delete">🗑️</button>
        </div>

        <h3 id="moveZoomHeading" data-i18n="moveZoom">Move & Zoom</h3>
        <div class="move-zoom-controls">
          <div class="move-controls">
            <button id="moveUpBtn" class="move-btn" data-i18n-title="moveUp">↑</button>
            <div class="move-row">
              <button id="moveLeftBtn" class="move-btn" data-i18n-title="moveLeft">←</button>
              <button id="moveRightBtn" class="move-btn" data-i18n-title="moveRight">→</button>
            </div>
            <button id="moveDownBtn" class="move-btn" data-i18n-title="moveDown">↓</button>
          </div>
          <div class="zoom-controls">
            <button id="zoomOutBtn" class="zoom-btn" data-i18n-title="zoomOut">−</button>
            <span id="zoomLevel">100%</span>
            <button id="zoomInBtn" class="zoom-btn" data-i18n-title="zoomIn">+</button>
          </div>
        </div>

        <h3 data-i18n="levelControls">Level Controls</h3>
        <div class="level-controls">
          <select id="levelpackSelect" class="control-input">
            <option value="default" data-i18n="default">Default</option>
            <option value="classic" data-i18n="classic">Classic</option>
          </select>
          <select id="levelSelect" class="control-input">
          </select>
          <input type="text" id="levelNameInput" class="control-input" data-i18n-placeholder="levelNamePlaceholder" placeholder="Level name (e.g., level2)" value="level1">
          <div class="color-picker-wrapper" id="wallColorWrapper">
            <input type="hidden" id="wallColorInput" value="#ff0000">
            <button type="button" id="wallColorBtn" class="wall-color-btn" data-i18n-title="wallColor" aria-haspopup="true" aria-expanded="false"></button>
            <div id="wallColorPopup" class="color-popup" style="display: none;" role="dialog" data-i18n-aria-label="wallColorPicker" aria-label="Wall color picker">
              <input type="color" id="wallColorPicker" class="control-input color-picker-input" value="#ff0000">
              <div class="color-rgb-display">
                <label for="wallColorRgb" data-i18n="rgbValues">RGB values:</label>
                <input type="text" id="wallColorRgb" class="control-input" value="255 0 0" readonly>
              </div>
              <button type="button" id="wallColorCopy" class="btn btn-secondary color-copy-btn" data-i18n="copyRgb">Copy RGB</button>
            </div>
          </div>
          <button id="loadBtn" class="btn btn-primary" data-i18n="load">Load</button>
          <button id="newBtn" class="btn btn-secondary" data-i18n="new">New</button>
          <button id="saveBtn" class="btn btn-success" data-i18n="save">Save</button>
          <button id="testBtn" class="btn btn-warning" data-i18n="test" data-i18n-title="testTitle">Test</button>
          <button id="addToPackBtn" class="btn btn-success" data-i18n="addToPack">Add to Pack</button>
        </div>

        <h3 data-i18n="levelParameters">Level Parameters</h3>
        <div class="parameter-grid">
          <div class="param-group">
            <label data-i18n="width">Width:</label>
            <input type="number" id="paramWidth" class="param-input" value="82" min="40" max="200">
          </div>
          <div class="param-group">
            <label data-i18n="height">Height:</label>
            <input type="number" id="paramHeight" class="param-input" value="120" min="20" max="300">
          </div>
          <div class="param-group">
            <div class="param-label-row">
              <label data-i18n="emptySpace">Empty Space:</label>
              <button type="button" class="info-btn" data-info="emptySpace" data-i18n-title="infoHelp">ℹ</button>
            </div>
            <input type="number" id="paramEmptySpace" class="param-input" value="5" min="-50" max="50">
          </div>
          <div class="param-group">
            <div class="param-label-row">
              <label data-i18n="bedrock">Bedrock:</label>
              <button type="button" class="info-btn" data-info="bedrock" data-i18n-title="infoHelp">ℹ</button>
            </div>
            <input type="number" id="paramBedrock" class="param-input" value="25" min="5" max="100">
          </div>
          <div class="color-picker-wrapper" id="podColorWrapper">
            <input type="hidden" id="podColorInput" value="#00a400">
            <button type="button" id="podColorBtn" class="wall-color-btn" data-i18n-title="podColor" aria-haspopup="true" aria-expanded="false"></button>
            <div id="podColorPopup" class="color-popup" style="display: none;" role="dialog" data-i18n-aria-label="podColorPicker" aria-label="Cargo Pod color picker">
              <input type="color" id="podColorPicker" class="control-input color-picker-input" value="#00a400">
              <div class="color-rgb-display">
                <label for="podColorRgb" data-i18n="rgbValues">RGB values:</label>
                <input type="text" id="podColorRgb" class="control-input" value="0 164 0" readonly>
              </div>
              <button type="button" id="podColorCopy" class="btn btn-secondary color-copy-btn" data-i18n="copyRgb">Copy RGB</button>
            </div>
          </div>
          
          <h3>Generator</h3>
          <button id="generateBtn" class="btn btn-info" data-i18n="generate">Generate</button>
          
          <div class="param-group">
            <div class="param-label-row">
              <label data-i18n="bunkers">Bunkers:</label>
              <button type="button" class="info-btn" data-info="bunkers" data-i18n-title="infoHelp">ℹ</button>
            </div>
            <input type="number" id="paramBunkers" class="param-input" value="5" min="0" max="20">
          </div>
          <div class="param-group">
            <div class="param-label-row">
              <label data-i18n="fuel">Fuel:</label>
              <button type="button" class="info-btn" data-info="fuel" data-i18n-title="infoHelp">ℹ</button>
            </div>
            <input type="number" id="paramFuel" class="param-input" value="6" min="0" max="20">
          </div>
          <div class="param-group">
            <div class="param-label-row">
              <label data-i18n="bunkerChance">Bunker Chance:</label>
              <button type="button" class="info-btn" data-info="bunkerChance" data-i18n-title="infoHelp">ℹ</button>
            </div>
            <input type="number" id="paramBunkerChance" class="param-input" value="" min="0" max="1" step="0.05">
          </div>
          <div class="param-group">
            <div class="param-label-row">
              <label data-i18n="fuelChance">Fuel Chance:</label>
              <button type="button" class="info-btn" data-info="fuelChance" data-i18n-title="infoHelp">ℹ</button>
            </div>
            <input type="number" id="paramFuelChance" class="param-input" value="" min="0" max="1" step="0.05">
          </div>
          
        </div>

      </aside>

      <!-- Center: Canvas -->
      <main class="canvas-container">
        <canvas id="levelCanvas"></canvas>
        <div class="canvas-info">
          <span id="cursorPos">X: 0, Y: 0</span>
          <span id="levelSize">Size: 80 x 50</span>
        </div>
      </main>

      <!-- Right sidebar: Tile palette -->
      <aside class="sidebar right-sidebar">
        <div class="top-bar">
          <div class="scroll-controls">
            <button id="scrollUpBtn" class="scroll-btn" data-i18n-title="scrollUp">↑</button>
            <div class="scroll-row">
              <button id="scrollLeftBtn" class="scroll-btn" data-i18n-title="scrollLeft">←</button>
              <button id="scrollRightBtn" class="scroll-btn" data-i18n-title="scrollRight">→</button>
            </div>
            <button id="scrollDownBtn" class="scroll-btn" data-i18n-title="scrollDown">↓</button>
          </div>
          <div id="currentTile" class="current-tile">
            <div class="tile-preview"></div>
            <span class="tile-name" data-i18n="empty">Empty</span>
          </div>
        </div>
        
        <!-- Level Preview -->
        <div id="previewPanel" class="preview-panel" style="display: block;">
          <h3 data-i18n="levelPreview">Level Preview</h3>
          <canvas id="previewCanvas" class="preview-canvas"></canvas>
        </div>

        <h3 data-i18n="templates">Templates</h3>
        <div id="templateButtons" class="template-buttons"></div>
        
        <h3 data-i18n="tilePalette">Tile Palette</h3>
        <div id="tilePalette" class="tile-palette"></div>
      </aside>
    </div>

  </div>

  <div id="infoPopover" class="info-popover" style="display: none;" role="dialog">
    <div class="info-popover-header">
      <span id="infoPopoverTitle"></span>
      <button type="button" id="infoPopoverClose" class="info-popover-close">&times;</button>
    </div>
    <div id="infoPopoverBody" class="info-popover-body"></div>
  </div>

  <div id="saveModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 data-i18n="levelAscii">Level ASCII</h3>
        <button type="button" id="closeModalBtn" class="modal-close">&times;</button>
      </div>
      <textarea id="saveModalText" class="modal-text" readonly></textarea>
      <div class="modal-actions">
        <button type="button" id="copyModalBtn" class="btn btn-secondary" data-i18n="copyModal">Copy</button>
        <button type="button" id="saveModalBtn" class="btn btn-success" data-i18n="saveAsTxt">Save as .txt</button>
      </div>
    </div>
  </div>

  <script src="i18n/levelEditorFrame.js"></script>
  <script src="tile-definitions.js"></script>
  <script src="level-renderer.js"></script>
  <script type="module" src="level-generator.js"></script>
  <script src="editor.js"></script>
</body>
</html>
